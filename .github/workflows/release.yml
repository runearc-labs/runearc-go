name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - name: Ask the Go module proxy to index this version (this is what puts it on pkg.go.dev)
        run: curl -fsS "https://proxy.golang.org/github.com/runearc-labs/runearc-go/@v/$GITHUB_REF_NAME.info"
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
